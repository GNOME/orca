# The following includes are for the CI templates that are used as a
# base to construct our container images.  They need to be updated periodically, but
# not frequently, by pointing them to a more recent commit.
include:
  - remote: "https://gitlab.gnome.org/Infrastructure/freedesktop-ci-templates/-/raw/3cd5fdf6dcfbef9a75514256d210db5178bd9c2a/templates/opensuse.yml"

variables:
  # When branching change the suffix to avoid conflicts with images
  # from the main branch
  BASE_TAG: "2026-09-08.3-main"
  FDO_UPSTREAM_REPO: "gnome/orca"

.orca_opensuse_tumbleweed_x86_64:
  variables:
    FDO_DISTRIBUTION_VERSION: "tumbleweed"
    FDO_DISTRIBUTION_TAG: "x86_64-${BASE_TAG}"

opensuse-container@x86_64:
  extends:
    - .orca_opensuse_tumbleweed_x86_64
    - .fdo.container-build@opensuse@x86_64
  stage: "container-build"
  variables:
    FDO_DISTRIBUTION_PACKAGES: >-
      cargo
      chromium
      dbus-1
      dbus-1-devel
      dejavu-fonts
      fuse
      gcc
      gettext
      gettext-tools
      git
      glib2-devel
      gobject-introspection-devel
      gsettings-desktop-schemas
      gstreamer-devel
      gtk3-devel
      itstool
      less
      libei-devel
      liblouis-devel
      libtool
      libXi-devel
      libXtst-devel
      libxkbcommon-devel
      libxml2-devel
      libX11-devel
      meson
      nano
      ninja
      procps
      python3
      python3-Babel
      python3-brlapi
      python3-curses
      python3-dasbus
      python3-gobject-devel
      python3-louis
      python3-lxml
      python3-pip
      python3-psutil
      python3-simplejson
      python3-speechd
      terminfo-base
      typelib-1_0-Vte-2_91
      vim
      xvfb-run
      yelp-devel
      yelp-tools
    FDO_DISTRIBUTION_EXEC: >-
      bash ci/install-python-tools.sh && bash ci/check-container.sh
