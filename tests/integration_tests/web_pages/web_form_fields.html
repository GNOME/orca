<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orca Web Form Fields ready</title>
<script>
function flip(el, attr) {
  el.setAttribute(attr, el.getAttribute(attr) === "true" ? "false" : "true");
}

function toggleTopic(el) {
  flip(el, "aria-checked");
  const topics = document.querySelectorAll(".topic");
  const checked = Array.from(topics).filter(function (topic) {
    return topic.getAttribute("aria-checked") === "true";
  }).length;
  const all = document.getElementById("all-topics");
  if (checked === 0) all.setAttribute("aria-checked", "false");
  else if (checked === topics.length) all.setAttribute("aria-checked", "true");
  else all.setAttribute("aria-checked", "mixed");
}

document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll('[role="checkbox"]').forEach(function (box) {
    box.addEventListener("keydown", function (event) {
      if (event.key !== " ") return;
      box.click();
      event.preventDefault();
    });
  });
});

function toggleAllTopics(el) {
  const checking = el.getAttribute("aria-checked") !== "true";
  el.setAttribute("aria-checked", checking ? "true" : "false");
  document.querySelectorAll(".topic").forEach(function (topic) {
    topic.setAttribute("aria-checked", checking ? "true" : "false");
  });
}
</script>
</head>
<body>
<h1>Form fields</h1>

<p><label for="name">Name</label> <input type="text" id="name" spellcheck="false" value="Jane Doe"></p>

<p><label for="bio">Bio</label>
<textarea id="bio" spellcheck="false">First line of bio. Second sentence here.</textarea></p>

<p><textarea role="combobox" aria-label="Search" aria-autocomplete="both" aria-haspopup="listbox" aria-expanded="false" spellcheck="false">foo bar baz</textarea></p>

<p><label for="fruit">Fruit</label>
<select id="fruit">
  <option>Apple</option>
  <option>Banana</option>
  <option>Cherry</option>
</select></p>

<p><label><input type="checkbox" id="subscribe"> Subscribe</label></p>

<div role="checkbox" id="all-topics" aria-checked="mixed" aria-controls="news events" tabindex="0" onclick="toggleAllTopics(this)">All topics</div>
<div role="checkbox" class="topic" id="news" aria-checked="true" tabindex="0" onclick="toggleTopic(this)">News</div>
<div role="checkbox" class="topic" id="events" aria-checked="false" tabindex="0" onclick="toggleTopic(this)">Events</div>

<fieldset>
  <legend>Pick a color</legend>
  <div><label><input type="radio" name="color" value="red"> Red color</label></div>
  <div><label><input type="radio" name="color" value="green"> Green color</label></div>
  <div><label><input type="radio" name="color" value="blue"> Blue color</label></div>
</fieldset>

<p><label for="qty">Quantity</label> <input type="number" id="qty" value="3"></p>

<p><button type="button">Submit</button></p>

<p><button type="button" aria-pressed="false" onclick="flip(this, 'aria-pressed')">Mute</button></p>

<p><button type="button" role="switch" aria-checked="false" onclick="flip(this, 'aria-checked')">Wi-Fi</button></p>

</body>
</html>
