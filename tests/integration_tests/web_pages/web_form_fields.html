<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orca Web Form Fields ready</title>
<script>
function flip(el, attr) {
  el.setAttribute(attr, el.getAttribute(attr) === "true" ? "false" : "true");
}

function toggleTopic(el) {
  flip(el, "aria-checked");
  const topics = document.querySelectorAll(".topic");
  const checked = Array.from(topics).filter(function (topic) {
    return topic.getAttribute("aria-checked") === "true";
  }).length;
  const all = document.getElementById("all-topics");
  if (checked === 0) all.setAttribute("aria-checked", "false");
  else if (checked === topics.length) all.setAttribute("aria-checked", "true");
  else all.setAttribute("aria-checked", "mixed");
}

document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll('[role="checkbox"]').forEach(function (box) {
    box.addEventListener("keydown", function (event) {
      if (event.key !== " ") return;
      box.click();
      event.preventDefault();
    });
  });
});

function toggleAllTopics(el) {
  const checking = el.getAttribute("aria-checked") !== "true";
  el.setAttribute("aria-checked", checking ? "true" : "false");
  document.querySelectorAll(".topic").forEach(function (topic) {
    topic.setAttribute("aria-checked", checking ? "true" : "false");
  });
}

function comboSetActive(index) {
  const combo = document.getElementById("contact");
  const options = Array.from(document.querySelectorAll("#contact-list [role='option']"));
  const option = options[index];
  combo.setAttribute("aria-activedescendant", option.id);
  options.forEach(function (candidate) {
    candidate.setAttribute("aria-selected", candidate === option ? "true" : "false");
  });
  combo.textContent = option.textContent.trim();
}

function comboCurrentIndex() {
  const combo = document.getElementById("contact");
  const options = Array.from(document.querySelectorAll("#contact-list [role='option']"));
  const index = options.findIndex(function (option) {
    return option.id === combo.getAttribute("aria-activedescendant");
  });
  return index === -1 ? 0 : index;
}

document.addEventListener("DOMContentLoaded", function () {
  const combo = document.getElementById("contact");
  const list = document.getElementById("contact-list");
  const options = Array.from(list.querySelectorAll('[role="option"]'));

  combo.addEventListener("keydown", function (event) {
    const expanded = combo.getAttribute("aria-expanded") === "true";
    const index = comboCurrentIndex();
    let handled = true;
    if (event.key === "ArrowDown" && !expanded) {
      list.style.display = "block";
      combo.setAttribute("aria-expanded", "true");
      comboSetActive(index);
    } else if (event.key === "ArrowDown") {
      if (index < options.length - 1) comboSetActive(index + 1);
    } else if (event.key === "ArrowUp" && expanded) {
      if (index > 0) comboSetActive(index - 1);
    } else if (event.key === "Escape" || event.key === "Enter") {
      list.style.display = "none";
      combo.setAttribute("aria-expanded", "false");
      combo.removeAttribute("aria-activedescendant");
    } else {
      handled = false;
    }
    if (handled) {
      event.preventDefault();
      event.stopPropagation();
    }
  });

  const group = document.getElementById("seat");
  const radios = Array.from(group.querySelectorAll('[role="radio"]'));
  group.addEventListener("keydown", function (event) {
    const index = radios.indexOf(document.activeElement);
    let handled = true;
    if (event.key === "ArrowDown" || event.key === "ArrowRight") checkSeat(radios[(index + 1) % radios.length]);
    else if (event.key === "ArrowUp" || event.key === "ArrowLeft") checkSeat(radios[(index - 1 + radios.length) % radios.length]);
    else if (event.key === " ") checkSeat(radios[index]);
    else handled = false;
    if (handled) {
      event.preventDefault();
      event.stopPropagation();
    }
  });

  function checkSeat(radio) {
    radios.forEach(function (candidate) {
      candidate.setAttribute("aria-checked", candidate === radio ? "true" : "false");
      candidate.tabIndex = candidate === radio ? 0 : -1;
    });
    radio.focus();
  }
});
</script>
<style>
#contact-list { display: none; margin: 0; padding: 0; list-style: none; border: 1px solid #aaa; width: 12em; }
#contact-list li { padding: 2px 4px; }
</style>
</head>
<body>
<h1>Form fields</h1>

<p><label for="name">Name</label> <input type="text" id="name" spellcheck="false" value="Jane Doe"></p>

<p><label for="bio">Bio</label>
<textarea id="bio" spellcheck="false">First line of bio. Second sentence here.</textarea></p>

<p><textarea role="combobox" aria-label="Search" aria-autocomplete="both" aria-haspopup="listbox" aria-expanded="false" spellcheck="false">foo bar baz</textarea></p>

<p><label for="fruit">Fruit</label>
<select id="fruit">
  <option>Apple</option>
  <option>Banana</option>
  <option>Cherry</option>
</select></p>

<div id="contact-label">Preferred contact</div>
<div id="contact" role="combobox" tabindex="0" aria-controls="contact-list" aria-expanded="false" aria-haspopup="listbox" aria-labelledby="contact-label">Email</div>
<ul id="contact-list" role="listbox" aria-labelledby="contact-label" tabindex="-1">
  <li id="contact-email" role="option" aria-selected="true">Email</li>
  <li id="contact-phone" role="option" aria-selected="false">Phone</li>
  <li id="contact-post" role="option" aria-selected="false">Post</li>
</ul>

<p><label><input type="checkbox" id="subscribe"> Subscribe</label></p>

<div role="checkbox" id="all-topics" aria-checked="mixed" aria-controls="news events" tabindex="0" onclick="toggleAllTopics(this)">All topics</div>
<div role="checkbox" class="topic" id="news" aria-checked="true" tabindex="0" onclick="toggleTopic(this)">News</div>
<div role="checkbox" class="topic" id="events" aria-checked="false" tabindex="0" onclick="toggleTopic(this)">Events</div>

<fieldset>
  <legend>Pick a color</legend>
  <div><label><input type="radio" name="color" value="red"> Red color</label></div>
  <div><label><input type="radio" name="color" value="green"> Green color</label></div>
  <div><label><input type="radio" name="color" value="blue"> Blue color</label></div>
</fieldset>

<div role="radiogroup" id="seat" aria-labelledby="seat-label">
  <div id="seat-label">Seat</div>
  <div role="radio" aria-checked="false" tabindex="0">Aisle</div>
  <div role="radio" aria-checked="false" tabindex="-1">Middle</div>
  <div role="radio" aria-checked="false" tabindex="-1">Window</div>
</div>

<p><label for="qty">Quantity</label> <input type="number" id="qty" value="3"></p>

<p><button type="button">Submit</button></p>

<p><button type="button" aria-pressed="false" onclick="flip(this, 'aria-pressed')">Mute</button></p>

<p><button type="button" role="switch" aria-checked="false" onclick="flip(this, 'aria-checked')">Wi-Fi</button></p>

</body>
</html>
