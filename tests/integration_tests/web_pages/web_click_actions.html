<html lang="en">
<head>
<meta charset="utf-8">
<title>Orca Click Actions ready</title>
<style>
  /* Physical clicks must not hide missing accessibility actions. */
  .action { pointer-events: none; }
</style>
</head>
<body>
<h1>Click actions</h1>
<p onclick="document.getElementById('result').textContent = 'Direct review activated.'">Direct review action</p>
<div onclick="document.getElementById('result').textContent = 'Inherited review activated.'">
  <p>Inherited review action</p>
</div>
<p class="action" onclick="document.getElementById('result').textContent = 'Direct activated.'">Direct action</p>
<div class="action" onclick="document.getElementById('result').textContent = 'Inherited activated.'">
  <p>Inherited action</p>
</div>
<p id="result">Nothing activated.</p>
</body>
</html>
