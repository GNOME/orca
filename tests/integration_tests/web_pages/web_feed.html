<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orca Web Feed ready</title>
<style>
article { margin: 0 0 1em; padding: 4px; border: 1px solid #aaa; }
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const feed = document.getElementById("restaurant-feed");
  const articles = Array.from(feed.querySelectorAll("article"));

  feed.addEventListener("keydown", function (event) {
    const article = event.target.closest("article");
    if (!article) return;
    const index = articles.indexOf(article);
    let handled = true;
    if (event.key === "PageDown" && index < articles.length - 1) articles[index + 1].focus();
    else if (event.key === "PageUp" && index > 0) articles[index - 1].focus();
    else if (event.key === "Home" && event.ctrlKey) document.getElementById("before").focus();
    else if (event.key === "End" && event.ctrlKey) document.getElementById("after").focus();
    else handled = false;
    if (handled) {
      event.preventDefault();
      event.stopPropagation();
    }
  });
});
</script>
</head>
<body>
<h1>Feed</h1>

<p><button type="button" id="before">Search trails</button></p>

<div id="restaurant-feed" role="feed" aria-labelledby="feed-label" aria-busy="false">
  <h2 id="feed-label">Trail reports</h2>
  <article tabindex="0" aria-posinset="1" aria-setsize="3" aria-labelledby="art1-title" aria-describedby="art1-body">
    <h3 id="art1-title">Fell Lane</h3>
    <p id="art1-body">Wet underfoot after the bridge.</p>
  </article>
  <article tabindex="0" aria-posinset="2" aria-setsize="3" aria-labelledby="art2-title" aria-describedby="art2-body">
    <h3 id="art2-title">Mill Path</h3>
    <p id="art2-body">The stile at the top is broken.</p>
  </article>
  <article tabindex="0" aria-posinset="3" aria-setsize="3" aria-labelledby="art3-title" aria-describedby="art3-body">
    <h3 id="art3-title">Quarry Loop</h3>
    <p id="art3-body">Waymarked as far as the gate.</p>
  </article>
</div>
<p><button type="button" id="after">Add a report</button></p>
<p>Text after the feed.</p>
</body>
</html>
