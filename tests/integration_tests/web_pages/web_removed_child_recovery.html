<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orca Web Removed Child Recovery ready</title>
<script>
// Remove the doomed paragraph the first time the caret enters it.
let removed = false;
function replaceOnFocus(element) {
  const replacement = element.cloneNode(true);
  replacement.removeAttribute("onfocus");
  replacement.textContent = "Replacement image";
  replacement.setAttribute("aria-label", "Replacement image");
  element.replaceWith(replacement);
  replacement.focus();
  replacement.setAttribute("onfocus", "replaceOnFocus(this)");
}
function setup() {
  document.addEventListener("selectionchange", () => {
    if (removed) return;
    const sel = document.getSelection();
    const doomed = document.getElementById("doomed");
    if (doomed && sel.anchorNode && doomed.contains(sel.anchorNode) && sel.anchorOffset >= 0) {
      removed = true;
      doomed.remove();
    }
  });
}
window.addEventListener("load", setup);
</script>
</head>
<body>
<h1>Go.</h1>
<p id="doomed">Doomed.</p>
<p id="after">After the doomed one.</p>
<p id="last">Last paragraph here.</p>
<p><span role="img" aria-label="Original image" tabindex="0" onfocus="replaceOnFocus(this)">Original image</span></p>
<p>End of page.</p>
</body>
</html>
