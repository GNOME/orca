<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orca Web Sliders ready</title>
</head>
<body>
<h1>Sliders</h1>

<p><label for="vol">Volume</label>
<input type="range" id="vol" min="0" max="4" value="2"></p>

<p>Download</p>
<progress id="dl" value="30" max="100"></progress>

<p><label for="disk">Disk usage</label> <meter id="disk" min="0" max="100" value="50">50 gigabytes</meter></p>

<p><span role="meter" id="battery" aria-label="Battery charge" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80" aria-valuetext="80 percent"></span></p>
</body>
</html>
